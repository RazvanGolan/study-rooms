<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:system-ui,sans-serif;color:#1f2937;display:flex}
aside{width:260px;border-right:1px solid #e5e7eb;padding:20px}
aside b{font-size:18px}
.mini{margin-top:24px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;text-align:center;color:#6b7280}
.mini span.on{background:#2563eb;color:#fff;border-radius:50%}
aside nav{margin-top:28px;display:flex;flex-direction:column;gap:6px;font-size:14px}
aside nav a{padding:8px 10px;border-radius:8px}aside nav a.on{background:#eff6ff;color:#2563eb}
main{flex:1;padding:20px 28px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:22px;font-weight:600}
.top button{margin-left:auto;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px}
.grid{margin-top:20px;display:grid;grid-template-columns:160px repeat(12,1fr);position:relative}
.h{font-size:12px;color:#6b7280;padding:6px 4px;border-bottom:1px solid #e5e7eb}
.r{height:96px;border-bottom:1px solid #f1f2f4;padding:12px 0;font-size:14px}
.r small{display:block;color:#6b7280}
.c{grid-column:span 12;border-bottom:1px solid #f1f2f4}
.e{position:absolute;height:72px;border-radius:10px;padding:8px 10px;font-size:13px;background:#dbeafe;color:#1e40af;border-left:4px solid #2563eb}
</style></head><body>

<div class="grid">
<div class="h"></div><div class="h">8</div><div class="h">9</div><div class="h">10</div><div class="h">11</div><div class="h">12</div><div class="h">13</div><div class="h">14</div><div class="h">15</div><div class="h">16</div><div class="h">17</div><div class="h">18</div><div class="h">19</div>
<div class="r">A101<small>Library · 3</small></div><div class="c"></div>
<div class="r">A102<small>Library · 6</small></div><div class="c"></div>
<div class="r">B204<small>Electrical Eng. · 10</small></div><div class="c"></div>
<div class="r">B210<small>Electrical Eng. · 8</small></div><div class="c"></div>
<div class="e" style="left:calc(160px + (100% - 160px)/12*2);width:calc((100% - 160px)/12*2);top:42px">Ioana D. · 10:00 to 12:00</div>
<div class="e" style="left:calc(160px + (100% - 160px)/12*2.5);width:calc((100% - 160px)/12*3);top:138px">Mihai I. · 10:30 to 13:30</div>
<div class="e" style="left:calc(160px + (100% - 160px)/12*7);width:calc((100% - 160px)/12*2);top:234px">Radu S. · 15:00 to 17:00</div>

</body></html>
