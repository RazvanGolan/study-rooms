# Builds the API image, pushes it to GitHub's container registry, and starts the new version on the server.
# It runs on every push to main that changes the API or the server files, and by hand (Actions, Run workflow).
#
# The deploy job needs, in the repository settings (Secrets and variables, Actions):
#   secret   SSH_KEY          a private key that the user ubuntu on the server accepts
#   variable SERVER           study-rooms.duckdns.org
#   variable SERVER_HOST_KEY  the server's public key, the line printed by: ssh-keyscan -t ed25519 study-rooms.duckdns.org
# Without SERVER, only the image is built and pushed.
name: API on the server

on:
  push:
    branches: [main]
    paths: ['src/**', 'deploy/**', 'global.json', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner has an x64 processor and the server an ARM one. The SDK builds the image for the server anyway.
      - run: dotnet publish src/StudyRooms.Api -t:PublishContainer --os linux --arch arm64 -p:ContainerRegistry=ghcr.io

  deploy:
    needs: image
    if: ${{ vars.SERVER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the server files and start the new version
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
          SERVER: ${{ vars.SERVER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          scp deploy/compose.yaml deploy/Caddyfile ubuntu@$SERVER:study-rooms/
          ssh ubuntu@$SERVER 'cd study-rooms && docker compose pull && docker compose up -d && docker image prune -f'
